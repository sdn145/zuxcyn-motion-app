<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zuxcyn Motion</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">Z</span><div><strong>Zuxcyn Motion</strong><small>Web Video Editor</small></div></div>
    <div class="history-actions">
      <button id="undoBtn" class="icon-btn" title="Undo">↶</button>
      <button id="redoBtn" class="icon-btn" title="Redo">↷</button>
    </div>
    <div class="top-actions">
      <button id="importBtn" class="btn secondary">＋ Import Media</button>
      <button id="exportBtn" class="btn primary">Export Project</button>
      <input id="mediaInput" type="file" accept="video/*,image/*" hidden>
    </div>
  </header>

  <main class="app-shell">
    <section class="workspace">
      <div class="stage-wrap">
        <div id="stage" class="stage">
          <div class="stage-empty" id="stageEmpty"><div class="empty-icon">▶</div><h2>Drop media here</h2><p>Import video, image, or add a text layer.</p></div>
          <video id="videoStage" playsinline hidden></video>
          <img id="imageStage" alt="Imported media" hidden>
          <div id="textStage" class="text-stage" hidden>Double-click to edit</div>
        </div>
        <div class="transport">
          <button id="rewindBtn" class="transport-btn">↶</button>
          <button id="playBtn" class="play-btn">▶</button>
          <button id="forwardBtn" class="transport-btn">↷</button>
          <input id="seekBar" class="seek" type="range" min="0" max="1" step="0.001" value="0">
          <span id="timeLabel">00:00.000 / 00:00.000</span>
        </div>
      </div>

      <aside class="inspector">
        <div class="tabs">
          <button class="tab active" data-tab="project">Project</button>
          <button class="tab" data-tab="effects">Effects</button>
          <button class="tab" data-tab="text">Text Layer</button>
        </div>

        <div id="projectTab" class="tab-panel active">
          <h3>Transform</h3>
          <div class="field-grid">
            <label>X <input id="posX" type="number" value="0"></label>
            <label>Y <input id="posY" type="number" value="0"></label>
            <label>Scale <input id="scale" type="number" value="100" min="1" max="500"></label>
            <label>Rotation <input id="rotation" type="number" value="0"></label>
            <label>Opacity <input id="opacity" type="number" value="100" min="0" max="100"></label>
          </div>
          <button id="addKeyframeBtn" class="btn primary full">◆ Add Keyframe</button>
          <hr>
          <h3>Media</h3>
          <button id="addTextBtn" class="btn secondary full">＋ Add Text Layer</button>
          <button id="clearBtn" class="btn danger full">Clear Active Layer</button>
        </div>

        <div id="effectsTab" class="tab-panel">
          <h3>Effects</h3>
          <div class="effect-grid">
            <button class="effect-card" data-effect="blur"><b>Blur</b><span>Soft focus</span></button>
            <button class="effect-card" data-effect="brightness"><b>Brightness</b><span>Light</span></button>
            <button class="effect-card" data-effect="contrast"><b>Contrast</b><span>Depth</span></button>
            <button class="effect-card" data-effect="grayscale"><b>Grayscale</b><span>B&W</span></button>
            <button class="effect-card" data-effect="sepia"><b>Sepia</b><span>Vintage</span></button>
            <button class="effect-card" data-effect="saturate"><b>Saturate</b><span>Color</span></button>
            <button class="effect-card" data-effect="hue"><b>Hue Rotate</b><span>Shift</span></button>
            <button class="effect-card" data-effect="glow"><b>Glow / Neon</b><span>Shadow</span></button>
          </div>
          <button id="resetEffectsBtn" class="btn secondary full">Reset Effects</button>
        </div>

        <div id="textTab" class="tab-panel">
          <h3>Text Layer</h3>
          <label class="wide-label">Text<textarea id="textInput" rows="3">Double-click to edit</textarea></label>
          <div class="field-grid">
            <label>Size <input id="fontSize" type="number" value="48" min="8" max="300"></label>
            <label>Weight <select id="fontWeight"><option value="400">Normal</option><option value="600">Semi Bold</option><option value="700">Bold</option><option value="900">Black</option></select></label>
          </div>
          <div class="align-row">
            <button class="btn secondary align-btn active" data-align="left">Left</button>
            <button class="btn secondary align-btn" data-align="center">Center</button>
            <button class="btn secondary align-btn" data-align="right">Right</button>
          </div>
        </div>
      </aside>
    </section>

    <section class="timeline-panel">
      <div class="timeline-head"><strong>Timeline</strong><span id="durationLabel">00:00.000</span></div>
      <div id="timeline" class="timeline">
        <div id="ruler" class="ruler"></div>
        <div class="track"><div class="track-name">Media</div><div id="mediaTrack" class="track-body"></div></div>
        <div class="track"><div class="track-name">Effects</div><div id="effectsTrack" class="track-body"></div></div>
        <div class="track"><div class="track-name">Keyframes</div><div id="keyframeTrack" class="track-body"></div></div>
        <div id="playhead" class="playhead"><i></i></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/player.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/keyframes.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/export.js"></script>
</body>
</html>
